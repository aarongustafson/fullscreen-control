<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Product presentation</title>
		<style>
			:root {
				color-scheme: light dark;
			}
			body {
				font:
					1rem/1.6 system-ui,
					sans-serif;
				background: Canvas;
				color: CanvasText;
				margin: 0;
				padding: 1rem;
				overflow-wrap: anywhere;
			}
			h1 {
				font-size: 1.25rem;
				margin-block: 0 0.5rem;
			}
			p {
				margin-block: 0.5rem;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Product presentation</h1>
			<p>
				Embedded content stays readable before enhancement and in
				fullscreen.
			</p>
			<p>
				Use Escape or the browser’s fullscreen controls to return to the
				examples. Scroll within this frame to read anything outside its
				viewport.
			</p>
		</main>
	</body>
</html>
